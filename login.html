<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a7c3a" />
  <title>Login Panitia — Haflah P3TQ</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">🕌</div>
    <h1>Absensi Haflah</h1>
    <p class="login-sub">P3TQ — MHMTQ 2027</p>

    <form id="loginForm" autocomplete="off">
      <label for="nama">Nama Panitia</label>
      <input type="text" id="nama" name="nama" placeholder="cth: Ahmad Chamdan" required autofocus />

      <label for="pin">PIN</label>
      <input type="password" id="pin" name="pin" inputmode="numeric" pattern="[0-9]*"
             placeholder="6 digit PIN" required maxlength="12" />

      <button type="submit" id="btnLogin" class="btn btn-primary">
        <span class="btn-text">Masuk</span>
      </button>

      <div id="loginError" class="error-box" hidden></div>
    </form>

    <p class="login-footer">Panitia Haul &amp; Haflah P3TQ – MHMTQ</p>
  </div>

  <!-- Supabase JS dari CDN (tanpa build step) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js"></script>
</body>
</html>
