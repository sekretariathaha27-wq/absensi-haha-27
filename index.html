<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a7c3a" />
  <title>Absensi Haflah — P3TQ MHMTQ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="app-page">

<!-- ============ HEADER ============ -->
<header class="app-header">
  <div class="header-left">
    <span class="brand">🕌 Absensi Haflah</span>
  </div>
  <div class="header-right">
    <span id="namaPanitia" class="panitia-chip"></span>
    <button id="btnLogout" class="btn-logout" title="Keluar">⏻</button>
  </div>
</header>

<!-- ============ KONTEN: TAB ============ -->
<main id="konten">

  <!-- ---------- TAB 1: SCAN ---------- -->
  <section id="tab-scan" class="tab-content active">
    <div class="scan-wrapper">
      <div id="reader" class="qr-reader"></div>

      <div id="scanHasil" class="scan-hasil" hidden>
        <div class="hasil-nama" id="hasilNama">—</div>
        <div class="hasil-kelas" id="hasilKelas">—</div>

        <div class="kuota-bar">
          <div><span id="hasilKuota">0</span> kuota</div>
          <div><span id="hasilTerpakai">0</span> terpakai</div>
          <div><span id="hasilSisa">0</span> sisa</div>
        </div>

        <div class="input-row">
          <button class="counter-btn" data-target="jmlL" data-delta="-1">−</button>
          <div class="counter-display">
            <span class="counter-label">Laki-laki</span>
            <span class="counter-val" id="jmlL">0</span>
          </div>
          <button class="counter-btn" data-target="jmlL" data-delta="1">+</button>
        </div>

        <div class="input-row">
          <button class="counter-btn" data-target="jmlP" data-delta="-1">−</button>
          <div class="counter-display">
            <span class="counter-label">Perempuan</span>
            <span class="counter-val" id="jmlP">0</span>
          </div>
          <button class="counter-btn" data-target="jmlP" data-delta="1">+</button>
        </div>

        <button id="btnKonfirmasi" class="btn btn-success btn-lg">Konfirmasi &amp; Serahkan Tiket</button>
        <button id="btnBatalScan" class="btn btn-ghost">Batal</button>
      </div>

      <div id="scanPesan" class="scan-pesan" hidden></div>
    </div>
  </section>

  <!-- ---------- TAB 2: DATA ---------- -->
  <section id="tab-data" class="tab-content">
    <div class="data-toolbar">
      <input type="search" id="cariData" placeholder="Cari nama santri / wali..." />
      <button id="btnTambahKeluarga" class="btn btn-primary btn-sm">+ Keluarga</button>
    </div>

    <div id="daftarData" class="list-data">
      <p class="muted">Memuat data...</p>
    </div>
  </section>

  <!-- ---------- TAB 3: LAPORAN ---------- -->
  <section id="tab-laporan" class="tab-content">
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Total Kuota</div>
        <div class="stat-val" id="statKuota">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Sudah Hadir</div>
        <div class="stat-val" id="statHadir">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Laki-laki</div>
        <div class="stat-val" id="statL">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Perempuan</div>
        <div class="stat-val" id="statP">—</div>
      </div>
    </div>

    <h3 class="section-title">Rekap per Kategori</h3>
    <div id="rekapKategori" class="rekap-list"></div>

    <button id="btnMuatUlang" class="btn btn-ghost btn-sm">Muat ulang data</button>
  </section>

</main>

<!-- ============ BOTTOM NAV ============ -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="scan">
    <span class="nav-icon">📷</span><span class="nav-label">Scan</span>
  </button>
  <button class="nav-btn" data-tab="data">
    <span class="nav-icon">👥</span><span class="nav-label">Data</span>
  </button>
  <button class="nav-btn" data-tab="laporan">
    <span class="nav-icon">📊</span><span class="nav-label">Laporan</span>
  </button>
</nav>

<!-- ============ MODAL TAMBAH KELUARGA ============ -->
<div id="modalKeluarga" class="modal" hidden>
  <div class="modal-box">
    <h3>Tambah Keluarga &amp; Santri</h3>
    <form id="formKeluarga">
      <label>Kode Keluarga</label>
      <input type="text" id="fKode" placeholder="SH0001" required />

      <label>Nama Wali</label>
      <input type="text" id="fNamaWali" required />

      <label>No. HP</label>
      <input type="tel" id="fHp" placeholder="08xxxxxxxxxx" required />

      <label>Nama Santri</label>
      <input type="text" id="fNamaSantri" required />

      <label>NIS</label>
      <input type="text" id="fNis" required />

      <label>Kelas</label>
      <input type="text" id="fKelas" placeholder="3 ALY A.02" />

      <label>Kategori</label>
      <select id="fKategori">
        <option value="BIL_GHOIB">Bil Ghoib</option>
        <option value="BIN_NADZOR">Bin Nadzor</option>
        <option value="TAMATAN">Tamatan</option>
      </select>

      <label>Sub Kategori</label>
      <input type="text" id="fSubKategori" placeholder="3 ALY A.02" required />

      <div class="modal-actions">
        <button type="button" id="btnModalBatal" class="btn btn-ghost">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ LIBRARY ============ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
