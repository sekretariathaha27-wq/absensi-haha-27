<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a7c3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Absensi Haflah" />
  <title>Absensi Haflah — P3TQ MHMTQ</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="app-page">

<!-- ============================================================
     HEADER
     ============================================================ -->
<header class="app-header">
  <div class="header-left">
    <span class="brand">🕌 Absensi Haflah</span>
  </div>
  <div class="header-right">
    <span id="namaPanitia" class="panitia-chip">—</span>
    <button id="btnLogout" class="btn-logout" title="Keluar">⏻</button>
  </div>
</header>

<!-- ============================================================
     MAIN CONTENT
     ============================================================ -->
<main id="konten">

  <!-- ============ TAB 1: SCAN ============ -->
  <section id="tab-scan" class="tab-content active">
    <div class="scan-wrapper">

      <!-- Kamera -->
      <div id="reader" class="qr-reader"></div>

      <!-- Panel hasil setelah QR terdeteksi -->
      <div id="scanHasil" class="scan-hasil" hidden>
        <div class="hasil-nama"  id="hasilNama">—</div>
        <div class="hasil-kelas" id="hasilKelas">—</div>

        <div class="kuota-bar">
          <div>
            <span id="hasilKuota">0</span>
            kuota
          </div>
          <div>
            <span id="hasilTerpakai">0</span>
            terpakai
          </div>
          <div>
            <span id="hasilSisa">0</span>
            sisa
          </div>
        </div>

        <!-- Counter Laki-laki -->
        <div class="input-row">
          <button type="button" class="counter-btn"
                  data-target="jmlL" data-delta="-1">−</button>
          <div class="counter-display">
            <span class="counter-label">Laki-laki</span>
            <span class="counter-val" id="jmlL">0</span>
          </div>
          <button type="button" class="counter-btn"
                  data-target="jmlL" data-delta="1">+</button>
        </div>

        <!-- Counter Perempuan -->
        <div class="input-row">
          <button type="button" class="counter-btn"
                  data-target="jmlP" data-delta="-1">−</button>
          <div class="counter-display">
            <span class="counter-label">Perempuan</span>
            <span class="counter-val" id="jmlP">0</span>
          </div>
          <button type="button" class="counter-btn"
                  data-target="jmlP" data-delta="1">+</button>
        </div>

        <!-- Counter Balita (opsional) -->
        <div class="input-row">
          <button type="button" class="counter-btn"
                  data-target="jmlB" data-delta="-1">−</button>
          <div class="counter-display">
            <span class="counter-label">Balita (opsional)</span>
            <span class="counter-val" id="jmlB">0</span>
          </div>
          <button type="button" class="counter-btn"
                  data-target="jmlB" data-delta="1">+</button>
        </div>

        <button id="btnKonfirmasi" class="btn btn-success btn-lg">
          ✓ Konfirmasi &amp; Serahkan Tiket
        </button>
        <button id="btnBatalScan" class="btn btn-ghost btn-lg">
          Batal
        </button>
      </div>

      <!-- Pesan error / info / sukses -->
      <div id="scanPesan" class="scan-pesan" hidden></div>

    </div>
  </section>

  <!-- ============ TAB 2: DATA ============ -->
  <section id="tab-data" class="tab-content">
    <div class="data-toolbar">
      <input type="search" id="cariData"
             placeholder="Cari nama santri / wali / kode..." />
      <button id="btnTambahKeluarga" class="btn btn-primary btn-sm">
        + Keluarga
      </button>
    </div>

    <div id="daftarData" class="list-data">
      <p class="muted">Memuat data...</p>
    </div>
  </section>

  <!-- ============ TAB 3: LAPORAN ============ -->
  <section id="tab-laporan" class="tab-content">
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Total Kuota</div>
        <div class="stat-val" id="statKuota">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Sudah Hadir</div>
        <div class="stat-val" id="statHadir">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Laki-laki</div>
        <div class="stat-val" id="statL">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Perempuan</div>
        <div class="stat-val" id="statP">—</div>
      </div>
    </div>

    <h3 class="section-title">Rekap per Kategori</h3>
    <div id="rekapKategori" class="rekap-list">
      <p class="muted">Memuat...</p>
    </div>

    <button id="btnMuatUlang" class="btn btn-ghost btn-sm"
            style="width:100%;margin-top:8px">
      ↻ Muat Ulang Data
    </button>
  </section>

</main>

<!-- ============================================================
     BOTTOM NAV
     ============================================================ -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="scan">
    <span class="nav-icon">📷</span>
    <span class="nav-label">Scan</span>
  </button>
  <button class="nav-btn" data-tab="data">
    <span class="nav-icon">👥</span>
    <span class="nav-label">Data</span>
  </button>
  <button class="nav-btn" data-tab="laporan">
    <span class="nav-icon">📊</span>
    <span class="nav-label">Laporan</span>
  </button>
</nav>

<!-- ============================================================
     MODAL: TAMBAH KELUARGA & SANTRI
     Pakai class "modal-open" (bukan atribut hidden)
     ============================================================ -->
<div id="modalKeluarga" class="modal">
  <div class="modal-box">
    <h3>Tambah Keluarga &amp; Santri</h3>

    <form id="formKeluarga" autocomplete="off">
      <label for="fKode">Kode Keluarga *</label>
      <input type="text" id="fKode" placeholder="SH0001"
             pattern="[A-Za-z0-9]+" required />

      <label for="fNamaWali">Nama Wali *</label>
      <input type="text" id="fNamaWali"
             placeholder="cth: Bpk. Ahmad Chamdan" required />

      <label for="fHp">No. HP Wali *</label>
      <input type="tel" id="fHp" placeholder="08xxxxxxxxxx"
             inputmode="numeric" required />

      <hr style="border:none;border-top:1px solid #e5e7eb;margin:16px 0" />

      <label for="fNamaSantri">Nama Santri *</label>
      <input type="text" id="fNamaSantri"
             placeholder="cth: Nafisatul Husna" required />

      <label for="fNis">NIS *</label>
      <input type="text" id="fNis" placeholder="2024001"
             inputmode="numeric" required />

      <label for="fKelas">Kelas</label>
      <input type="text" id="fKelas" placeholder="cth: 3 ALY A.02" />

      <label for="fKategori">Kategori *</label>
      <select id="fKategori" required>
        <option value="">— Pilih Kategori —</option>
        <option value="BIL_GHOIB">Bil Ghoib (4 tiket)</option>
        <option value="BIN_NADZOR">Bin Nadzor (2 tiket)</option>
        <option value="TAMATAN">Tamatan (2 tiket)</option>
      </select>

      <label for="fSubKategori">Sub Kategori *</label>
      <input type="text" id="fSubKategori"
             placeholder="cth: 3 ALY A.02" required />

      <div class="modal-actions">
        <button type="button" id="btnModalBatal" class="btn btn-ghost">
          Batal
        </button>
        <button type="submit" class="btn btn-primary" id="btnModalSimpan">
          Simpan
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ============================================================
     LIBRARY
     ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="app.js"></script>

</body>
</html>
